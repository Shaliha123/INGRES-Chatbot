    <style>
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            background: #ffffff;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }
        .doc-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .doc-table th, .doc-table td {
            padding: 1rem 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        .doc-table th {
            background: #f8fafc;
            font-weight: 700;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

    <main class="app-main">
        <div class="doc-header">
            <h1 style="font-size: 1.8rem; font-weight: 800;">Document Repository</h1>
            <button class="btn btn-register">Refresh System</button>
        </div>

        <div class="upload-zone" id="drop-zone">
            <input type="file" id="file-input" hidden multiple>
            <div style="font-size: 3rem; margin-bottom: 1rem;">📁</div>
            <h3 style="margin-bottom: 0.5rem;">Click to upload or drag and drop</h3>
            <p style="color: var(--text-muted);">PDF, DOCX, XLSX (Max 10MB)</p>
        </div>

        <h3 style="margin-bottom: 1.5rem; font-weight: 700;">Recent Uploads</h3>
        <table class="doc-table">
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Type</th>
                    <th>Uploaded Date</th>
                    <th>Extracted Text Preview</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="doc-body">
                <tr><td colspan="5" style="color: var(--text-muted);">Loading documents...</td></tr>
            </tbody>
        </table>
    </main>

    <script type="module">
        import APIClient from './js/api.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const docBody = document.getElementById('doc-body');

        async function loadDocuments() {
            try {
                const res = await APIClient.listDocuments();
                if (res.success && res.data && res.data.length > 0) {
                    docBody.innerHTML = '';
                    const seenIds = new Set();
                    res.data.forEach(doc => {
                        if (seenIds.has(doc.id)) return;
                        seenIds.add(doc.id);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="font-weight: 600;">${doc.title || doc.filename}</td>
                            <td><span class="status-badge status-done">${doc.file_type.toUpperCase()}</span></td>
                            <td>${new Date(doc.upload_date).toLocaleDateString()}</td>
                            <td style="font-size: 0.85rem; max-width: 300px; color: var(--text-muted);">${doc.extracted_text_preview || 'No text extracted'}</td>
                            <td><button class="ai-summary-btn btn-delete-doc" data-id="${doc.id}" style="background: #ef4444; color: white;">Delete</button></td>
                        `;
                        docBody.appendChild(row);
                    });


                    document.querySelectorAll('.btn-delete-doc').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            if (confirm("Are you sure you want to delete this document?")) {
                                const id = btn.dataset.id;
                                await APIClient.deleteDocument(id);
                                loadDocuments();
                            }
                        });
                    });
                } else {
                    docBody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">No documents uploaded yet. Drop files above to upload!</td></tr>';
                }
            } catch (err) {
                docBody.innerHTML = '<tr><td colspan="5" style="color: red;">Failed to load documents. Ensure backend server is running.</td></tr>';
            }
        }
        loadDocuments();

        dropZone.addEventListener('click', () => fileInput.click());

        // Drag and Drop support
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary)';
            dropZone.style.background = 'var(--primary-light)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
            dropZone.style.background = 'white';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
            dropZone.style.background = 'white';
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                uploadFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                uploadFiles(e.target.files);
            }
        });

        async function uploadFiles(files) {
            const token = APIClient.getAuthToken();
            if (!token) {
                alert("Please log in first to upload documents.");
                window.location.href = 'login.html';
                return;
            }

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);

                try {
                    dropZone.style.opacity = '0.5';
                    const res = await APIClient.uploadDocument(formData);
                    if (res.success) {
                        alert(`Uploaded and processed "${file.name}" successfully! Text extracted and indexed for AI Chat.`);
                        loadDocuments();
                    } else {
                        alert(`Upload failed: ${res.message}`);
                    }
                } catch (err) {
                    alert(`Upload Error: ${err.message}`);
                } finally {
                    dropZone.style.opacity = '1';
                }
            }
            fileInput.value = '';
        }

        document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await APIClient.logout();
            window.location.href = 'login.html';
        });
    </script>
</body>
