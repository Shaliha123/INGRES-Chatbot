<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - INGRES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-layout">
    <aside class="app-sidebar">
        <a href="index.html" class="logo" style="color: white; margin-bottom: 3rem;">
            <div class="logo-icon" style="background: var(--primary);">
                 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            INGRES
        </a>
        <nav style="flex: 1;">
            <a href="dashboard.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span data-i18n="dashboard">Dashboard</span>
            </a>
            <a href="chat.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                <span data-i18n="chat">Chat</span>
            </a>
            <a href="knowledge.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span data-i18n="knowledge">Knowledge Base</span>
            </a>
            <a href="documents.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span data-i18n="documents">Documents</span>
            </a>
            <a href="history.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span data-i18n="history">History</span>
            </a>
            <a href="analytics.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span data-i18n="analytics">Analytics</span>
            </a>
        </nav>
        <div style="border-top: 1px solid #1e293b; padding-top: 1.5rem;">
            <a href="settings.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span data-i18n="settings">Settings</span>
            </a>
            <a href="profile.html" class="app-nav-item active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span data-i18n="profile">Profile</span>
            </a>
            <a href="#" id="logout-btn" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span data-i18n="logout">Logout</span>
            </a>
        </div>
    </aside>

    <main class="app-main">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 1.8rem; font-weight: 800;">My Profile</h1>
        </header>

        <div style="max-width: 800px; background: white; padding: 4rem; border-radius: 30px; box-shadow: var(--shadow-sm);">
            <div style="display: flex; align-items: center; gap: 3rem; margin-bottom: 4rem; padding-bottom: 3rem; border-bottom: 1px solid var(--border-color);">
                <div style="width: 120px; height: 120px; border-radius: 50%; background: var(--bg-dark); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800;">U</div>
                <div>
                    <h2 id="profile-name" style="font-size: 2rem; margin-bottom: 0.5rem;">User Name</h2>
                    <p id="profile-email" style="color: var(--text-muted); font-size: 1.1rem;">user@example.com</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;">
                <div>
                    <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Account Details</h3>
                    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                        <div>
                            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Role</label>
                            <div style="font-weight: 600;">Administrator</div>
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Member Since</label>
                            <div style="font-weight: 600;">May 10, 2024</div>
                        </div>
                    </div>
                </div>
                <div>
                    <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Preferences</h3>
                    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                        <div>
                            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Language</label>
                            <div style="font-weight: 600;">English</div>
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Notifications</label>
                            <div style="font-weight: 600;">Enabled</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import APIClient from './js/api.js';

        async function loadProfile() {
            try {
                const res = await APIClient.getProfile();
                if (res.success && res.data) {
                    const u = res.data;
                    document.getElementById('profile-name').textContent = u.name || u.email;
                    document.getElementById('profile-email').textContent = u.email;
                }
            } catch (err) {
                console.warn("Notice: Sign in to view live profile details.");
            }
        }
        loadProfile();

        document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await APIClient.logout();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
