<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-layout">
    <aside class="app-sidebar">
        <a href="index.html" class="logo" style="color: white; margin-bottom: 3rem;">
            <div class="logo-icon" style="background: #ef4444;">
                 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            INGRES ADMIN
        </a>
        <nav style="flex: 1;">
            <a href="admin.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                System Overview
            </a>
            <a href="users.html" class="app-nav-item active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                User Management
            </a>
            <a href="#" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                AI Model Config
            </a>
            <a href="#" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Audit Logs
            </a>
        </nav>
        <div style="border-top: 1px solid #1e293b; padding-top: 1.5rem;">
            <a href="dashboard.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                Back to User App
            </a>
            <a href="#" id="logout-btn" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </a>
        </div>
    </aside>

    <main class="app-main">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
            <div>
                <h1 style="font-size: 1.8rem; font-weight: 800;">User Management</h1>
                <p style="color: var(--text-muted);">Manage and monitor all platform users.</p>
            </div>
            <button class="btn btn-register">Add New User</button>
        </header>

        <div style="background: white; border-radius: 24px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: var(--bg-alt); text-align: left;">
                        <th style="padding: 1.25rem 2rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;">User</th>
                        <th style="padding: 1.25rem 2rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;">Role</th>
                        <th style="padding: 1.25rem 2rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;">Status</th>
                        <th style="padding: 1.25rem 2rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase;">Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <tr><td colspan="4" style="padding: 2rem; color: var(--text-muted);">Loading registered users...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import APIClient from './js/api.js';

        async function loadUsersPage() {
            const tbody = document.getElementById('user-table-body');
            try {
                const res = await APIClient.listUsers();
                if (res.success && res.data && res.data.length > 0) {
                    tbody.innerHTML = '';
                    res.data.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.style.cssText = "border-bottom: 1px solid var(--border-color);";
                        tr.innerHTML = `
                            <td style="padding: 1.25rem 2rem;">
                                <div style="font-weight: 700;">${u.name || 'User'}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">${u.email}</div>
                            </td>
                            <td style="padding: 1.25rem 2rem;"><span style="background: #e0e7ff; color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700;">${u.role}</span></td>
                            <td style="padding: 1.25rem 2rem;"><span style="color: #10b981; font-weight: 600;">Active</span></td>
                            <td style="padding: 1.25rem 2rem;"><button class="btn-delete-user" data-id="${u.id}" style="color: #ef4444; font-weight: 700; border: none; background: none; cursor: pointer;">Delete</button></td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.querySelectorAll('.btn-delete-user').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            if (confirm("Are you sure you want to delete this user?")) {
                                await APIClient.request(`/users/${btn.dataset.id}`, 'DELETE');
                                loadUsersPage();
                            }
                        });
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="padding: 2rem; color: var(--text-muted);">No users found. Admin access required.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding: 2rem; color: red;">Admin authorization required to view users list.</td></tr>';
            }
        }
        loadUsersPage();

        document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await APIClient.logout();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
