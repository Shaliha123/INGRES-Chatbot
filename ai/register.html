<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - INGRES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-welcome-text">JOIN US</div>
    <div class="auth-card">
        <div class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            INGRES
        </div>
        <div class="auth-title" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
                <svg width="80" height="80" viewBox="0 0 500 500">
                    <circle cx="250" cy="250" r="180" fill="#eef2ff" />
                    <rect x="170" y="180" width="160" height="140" rx="45" fill="white" stroke="#e2e8f0" stroke-width="2"/>
                    <rect x="190" y="200" width="120" height="80" rx="35" fill="#1e293b" />
                    <circle cx="225" cy="240" r="10" fill="#3b82f6">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="275" cy="240" r="10" fill="#3b82f6">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <rect x="150" y="225" width="20" height="50" rx="10" fill="#cbd5e1" />
                    <rect x="330" y="225" width="20" height="50" rx="10" fill="#cbd5e1" />
                </svg>
            </div>
            <h2>Create Account 🚀</h2>
            <p>Register to get started</p>
        </div>
        <form id="register-form">
            <div class="form-field">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            <div class="form-field">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            </div>
            <div style="display: flex; align-items: flex-start; gap: 0.75rem; margin: 1.5rem 0; font-size: 0.85rem; color: var(--text-muted);">
                <input type="checkbox" id="terms" style="margin-top: 3px;" required>
                <label for="terms">I agree to the <a href="terms.html" style="color: var(--primary); font-weight: 600;">Terms of Service</a> and <a href="privacy.html" style="color: var(--primary); font-weight: 600;">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn-auth-submit">Register</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Login</a>
        </div>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword } from './js/auth.js';

        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert("Registration failed: " + error.message);
            }
        });
    </script>
</body>
</html>
