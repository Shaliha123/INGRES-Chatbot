<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - INGRES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-welcome-text">WELCOME</div>
    <div class="auth-card">
        <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            INGRES
        </div>
        <div class="auth-title">
            <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
                <svg width="100" height="100" viewBox="0 0 500 500">
                    <circle cx="250" cy="250" r="180" fill="#eef2ff" />
                    <rect x="170" y="180" width="160" height="140" rx="45" fill="white" stroke="#e2e8f0" stroke-width="2"/>
                    <rect x="190" y="200" width="120" height="80" rx="35" fill="#1e293b" />
                    <circle cx="225" cy="240" r="10" fill="#3b82f6">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="275" cy="240" r="10" fill="#3b82f6">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <rect x="150" y="225" width="20" height="50" rx="10" fill="#cbd5e1" />
                    <rect x="330" y="225" width="20" height="50" rx="10" fill="#cbd5e1" />
                </svg>
            </div>
            <h2>Welcome Back! 👋</h2>
            <p>Login to your account</p>
        </div>
        <form id="login-form">
            <div class="form-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" id="btn-submit" class="btn-auth-submit">Login</button>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Register</a>
        </div>
    </div>

    <script type="module">
        import APIClient from './js/api.js';

        const loginForm = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            btnSubmit.disabled = true;
            btnSubmit.textContent = "Logging in...";

            try {
                const res = await APIClient.login(email, password);
                if (res.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Login failed: " + res.message);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Login";
                }
            } catch (error) {
                alert("Login Error: " + error.message);
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Login";
            }
        });
    </script>
</body>
</html>
