<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - INGRES</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </div>
                INGRES
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="features.html">Features</a>
                <a href="how-it-works.html">How It Works</a>
                <a href="use-cases.html">Use Cases</a>
                <a href="faq.html">FAQs</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-login">Login</a>
                <a href="register.html" class="btn btn-register">Register</a>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="section-header">
                <h2>Contact Us</h2>
                <p>Have questions or need support? We're here to help you get the most out of INGRES.</p>
            </div>

            <div style="max-width: 900px; margin: 4rem auto; display: grid; grid-template-columns: 1fr 1.5fr; gap: 4rem; background: white; padding: 4rem; border-radius: 30px; box-shadow: var(--shadow-lg);">
                <div>
                    <h3 style="margin-bottom: 2rem;">Get in Touch</h3>
                    <div style="display: flex; flex-direction: column; gap: 2rem;">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <div style="width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                                📧
                            </div>
                            <div>
                                <div style="font-weight: 700; font-size: 0.9rem;">Email</div>
                                <div style="color: var(--text-muted); font-size: 0.95rem;">support@ingres.ai</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <div style="width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                                📍
                            </div>
                            <div>
                                <div style="font-weight: 700; font-size: 0.9rem;">Office</div>
                                <div style="color: var(--text-muted); font-size: 0.95rem;">Tech Hub, SIH 2024</div>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="contact-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div class="form-field">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Your name" required>
                        </div>
                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Your email" required>
                        </div>
                    </div>
                    <div class="form-field" style="margin-bottom: 1.5rem;">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="What is this about?" required>
                    </div>
                    <div class="form-field" style="margin-bottom: 2rem;">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Your message..." style="width: 100%; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 1rem; resize: none;" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-register" style="width: 100%; padding: 1rem; font-size: 1rem;">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            © 2026 INGRES. All rights reserved.
        </div>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Message sent! We'll get back to you soon.");
            e.target.reset();
        });
    </script>
</body>
</html>
