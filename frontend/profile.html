<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - INGRES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="js/theme.js"></script>
</head>
    <style>
        .profile-card {
            max-width: 900px;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin: 0 auto;
        }
        .profile-avatar-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0284c7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            box-shadow: var(--shadow-sm);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #475569;
        }
        .form-control {
            padding: 0.65rem 1rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        @media (max-width: 1024px) {
            .app-sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 1000;
                transition: transform 0.3s ease;
            }
            .app-sidebar.open { transform: translateX(280px); }
        }
    </style>
</head>
<body class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar">
        <a href="index.html" class="logo" style="color: white; margin-bottom: 3rem;">
            <div class="logo-icon" style="background: var(--primary);">
                 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            INGRES
        </a>
        <nav style="flex: 1;">
            <a href="dashboard.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span data-i18n="dashboard">Dashboard</span>
            </a>
            <a href="chat.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                <span data-i18n="chat">Chat</span>
            </a>
            <a href="knowledge.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span data-i18n="knowledge">Knowledge Base</span>
            </a>
            <a href="documents.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span data-i18n="documents">Documents</span>
            </a>
            <a href="history.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span data-i18n="history">History</span>
            </a>
            <a href="analytics.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span data-i18n="analytics">Analytics</span>
            </a>
        </nav>
        <div style="border-top: 1px solid #1e293b; padding-top: 1.5rem;">
            <a href="settings.html" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span data-i18n="settings">Settings</span>
            </a>
            <a href="profile.html" class="app-nav-item active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span data-i18n="profile">Profile</span>
            </a>
            <a href="#" id="logout-btn" class="app-nav-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span data-i18n="logout">Logout</span>
            </a>
        </div>

    <main class="app-main">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">User Profile & Professional Designation</h1>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">Manage personal account credentials, organization details, and hydrogeology role</p>
        </header>

        <div class="profile-card">
            <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-color);">
                <div class="profile-avatar-box" id="avatar-initial">U</div>
                <div>
                    <h2 id="profile-name" style="font-size: 1.5rem; font-weight: 800; color: #0f172a;">Hydrogeology User</h2>
                    <p id="profile-email" style="color: var(--text-muted); font-size: 0.95rem; margin-top: 2px;">user@example.com</p>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.65rem;">
                        <span style="background: #e0f2fe; color: #0369a1; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 999px;">
                            🛡️ Senior Hydrogeologist
                        </span>
                        <span style="background: #dcfce7; color: #15803d; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 999px;">
                            CGWB Verified
                        </span>
                    </div>
                </div>
            </div>

            <form id="profile-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="form-group">
                        <label for="input-name">Full Name</label>
                        <input type="text" id="input-name" class="form-control" placeholder="Dr. S. Kumar">
                    </div>
                    <div class="form-group">
                        <label for="input-email">Email Address</label>
                        <input type="email" id="input-email" class="form-control" readonly style="background: #f8fafc; cursor: not-allowed;">
                    </div>
                    <div class="form-group">
                        <label for="input-org">Organization / Division</label>
                        <input type="text" id="input-org" class="form-control" placeholder="Central Ground Water Board (CGWB)">
                    </div>
                    <div class="form-group">
                        <label for="input-designation">Designation</label>
                        <select id="input-designation" class="form-control">
                            <option value="Senior Hydrogeologist">Senior Hydrogeologist</option>
                            <option value="Research Scientist">Research Scientist / Scholar</option>
                            <option value="Water Resource Engineer">Water Resource Engineer</option>
                            <option value="Government Official">Government / State Official</option>
                            <option value="Citizen / Farmer">Citizen / Local Representative</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-state">Primary Region / State</label>
                        <input type="text" id="input-state" class="form-control" placeholder="Tamil Nadu (South Region)">
                    </div>
                    <div class="form-group">
                        <label for="input-phone">Contact Phone</label>
                        <input type="tel" id="input-phone" class="form-control" placeholder="+91 98765 43210">
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; pt-2; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
                    <span id="save-status-msg" style="font-size: 0.85rem; font-weight: 600; color: #16a34a;"></span>
                    <button type="submit" class="btn btn-register" style="padding: 0.65rem 1.8rem;">Save Profile Changes</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import APIClient from './js/api.js';

        const profileForm = document.getElementById('profile-form');
        const saveStatusMsg = document.getElementById('save-status-msg');

        async function loadProfile() {
            try {
                const storedUser = localStorage.getItem("ingres_user");
                if (storedUser) {
                    const u = JSON.parse(storedUser);
                    document.getElementById('profile-name').textContent = u.name || u.email;
                    document.getElementById('profile-email').textContent = u.email;
                    document.getElementById('avatar-initial').textContent = (u.name || u.email).charAt(0).toUpperCase();
                    
                    document.getElementById('input-name').value = u.name || '';
                    document.getElementById('input-email').value = u.email || '';
                    document.getElementById('input-org').value = u.org || 'Central Ground Water Board (CGWB)';
                    document.getElementById('input-designation').value = u.designation || 'Senior Hydrogeologist';
                    document.getElementById('input-state').value = u.state || 'Tamil Nadu (South Region)';
                    document.getElementById('input-phone').value = u.phone || '+91 98765 43210';
                }

                const res = await APIClient.getProfile();
                if (res.success && res.data) {
                    const u = res.data;
                    document.getElementById('profile-name').textContent = u.name || u.email;
                    document.getElementById('profile-email').textContent = u.email;
                    document.getElementById('input-name').value = u.name || '';
                    document.getElementById('input-email').value = u.email || '';
                }
            } catch (err) {
                console.warn("Notice: Sign in to view live profile details.");
            }
        }
        loadProfile();

        profileForm?.addEventListener('submit', (e) => {
            e.preventDefault();
            const storedUser = localStorage.getItem("ingres_user");
            let userObj = storedUser ? JSON.parse(storedUser) : {};

            userObj.name = document.getElementById('input-name').value;
            userObj.org = document.getElementById('input-org').value;
            userObj.designation = document.getElementById('input-designation').value;
            userObj.state = document.getElementById('input-state').value;
            userObj.phone = document.getElementById('input-phone').value;

            localStorage.setItem("ingres_user", JSON.stringify(userObj));
            document.getElementById('profile-name').textContent = userObj.name;

            saveStatusMsg.textContent = "✓ Profile settings updated & saved successfully!";
            setTimeout(() => saveStatusMsg.textContent = "", 3500);
        });

        document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await APIClient.logout();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
</html>
